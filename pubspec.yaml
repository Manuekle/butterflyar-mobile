name: butterflyar
description: "Aplicación Flutter para Android para explorar mariposas en Realidad Aumentada con ARCore."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  google_fonts: ^6.2.1
  mobile_scanner: ^7.0.0
  permission_handler: ^11.3.0
  # arkit_plugin: ^1.1.2 # ⭐ DEPRECATED - iOS ahora usa ar_flutter_plugin con GLB
  audioplayers: ^6.5.0
  webview_flutter: ^4.13.0
  vibration: ^3.1.3
  vector_math: ^2.1.4
  path: ^1.9.0
  camera: ^0.11.2
  model_viewer_plus: ^1.9.3 # ⭐ PARA FALLBACK CON GLB
  lucide_icons_flutter: ^3.0.3
  url_launcher: ^6.3.2
  device_info_plus: ^11.1.0
  gal: ^2.3.2
  image: ^4.5.4
  # ⭐ ARCORE FLUTTER PLUGIN PARA ANDROID (más estable)
  arcore_flutter_plugin: ^0.1.0
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

# ⭐ ESTRUCTURA HÍBRIDA OPTIMIZADA
flutter:
  uses-material-design: true

  assets:
    - assets/icon/favicon.png
    - assets/images/
    - assets/icon/semillero/deveniac.png
    - assets/icon/smurtfit/smurtfit.svg
    - assets/icon/universidad/fup.svg
    # ⭐ MODELOS GLB PARA ANDROID E iOS (ARCore) Y MODEL VIEWER
    - assets/models/ # Todos los .glb
    - assets/sounds/
    - assets/backgrounds/
    - lib/data/butterflies.json