name: butterflyar
description: "Aplicación Flutter multiplataforma (Android & iOS) para explorar mariposas en Realidad Aumentada."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  google_fonts: ^6.2.1
  mobile_scanner: ^7.0.0
  permission_handler: ^12.0.1
  arkit_plugin: ^1.1.2 # ⭐ iOS ARKit - REQUIERE SCN
  audioplayers: ^6.5.0
  webview_flutter: ^4.13.0
  vibration: ^3.1.3
  vector_math: ^2.1.4
  path: ^1.9.0
  camera: ^0.11.2
  model_viewer_plus: ^1.9.3 # ⭐ PARA FALLBACK CON GLB
  lucide_icons_flutter: ^3.0.3
  url_launcher: ^6.3.2
  device_info_plus: ^11.1.0
  gal: ^2.3.2
  image: ^4.5.4
  # ⭐ ARCORE CON SOPORTE GLB
  arcore_flutter_plugin:
    git:
      url: https://github.com/giandifra/arcore_flutter_plugin.git
      ref: master
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

# ⭐ ESTRUCTURA HÍBRIDA OPTIMIZADA
flutter:
  uses-material-design: true

  assets:
    - assets/icon/favicon.png
    - assets/images/
    - assets/icon/semillero/deveniac.png
    - assets/icon/smurtfit/smurtfit.svg
    - assets/icon/universidad/fup.svg
    # ⭐ MODELOS GLB PARA ANDROID/MODEL VIEWER
    - assets/models/ # Todos los .glb
    # ⭐ MODELOS SCN PARA IOS ESTÁN EN ios/Runner/models.scnassets/
    - ios/Runner/models.scnassets/ # Todos los .scn
    - assets/sounds/
    - assets/backgrounds/
    - lib/data/butterflies.json